<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YAB STUDIO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#0B0B0C;--card:#151516;--card2:#222224;--line:#2C2C2F;--fg:#F4F4F5;--muted:#A0A0A6;--inv:#0B0B0C;color-scheme:dark}
:root[data-theme="light"]{--ground:#E9EAEC;--card:#FFFFFF;--card2:#F1F2F3;--line:#DDDEE1;--fg:#0B0B0C;--muted:#5B5E65;--inv:#FFFFFF;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--fg)}
body{font-family:'Onest',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid currentColor;outline-offset:2px}
textarea::placeholder,input::placeholder{color:currentColor;opacity:.6}
.scroll{scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{flex:none;height:56px;display:flex;align-items:center;padding:0 20px}
.logo{font-family:'Unbounded',system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:-0.02em;white-space:nowrap;user-select:none}
.logo .o{color:transparent;-webkit-text-stroke:1px var(--fg);margin-left:6px}
#content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.page{padding:4px 12px 20px;display:flex;flex-direction:column;gap:12px}
.col{display:flex;flex-direction:column}

.card{background:var(--card);border-radius:20px;padding:16px}
.card.tail{padding-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.between{display:flex;justify-content:space-between;align-items:baseline}
h2,h3{margin:0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--fg);color:var(--inv);font-size:11px;font-weight:600;white-space:nowrap}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--fg);background:transparent}
.dot.new{border-color:var(--muted)}
.dot.in_progress{background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
.dot.done{background:var(--fg)}
.st{display:flex;align-items:center;gap:6px}

.banner{display:flex;align-items:center;gap:12px;padding:14px 16px}
.banner .pt{flex:none;width:8px;height:8px;border-radius:50%;background:var(--fg)}
.banner .tx{min-width:0;font-size:13px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.banner .tx b{color:var(--fg);font-weight:600}

.proj{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.proj .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.proj .name{font-weight:500}
.segs{display:flex;gap:4px}
.segs span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segs span.on{background:var(--fg)}

.post .date{font-size:13px;color:var(--muted)}
.post h3{margin:6px 0 8px;font-size:18px;line-height:1.25;font-weight:600;text-wrap:balance;overflow-wrap:anywhere}
.post p{margin:0 0 8px;font-size:15px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.go{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0;border:0;border-top:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;text-align:left}
.go svg{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.fhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.fhead h2{font-size:20px;font-weight:600}
.fhead .n{font-size:14px;color:var(--muted);margin-left:8px}
.newbtn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 16px 0 12px;border:0;border-radius:999px;background:var(--fg);color:var(--inv);font-size:14px;font-weight:600}
.newbtn svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.filters{background:var(--card);border-radius:20px;padding:6px 8px 12px;display:flex;flex-direction:column;gap:2px}
.chips{display:flex;gap:2px;overflow-x:auto}
.chip{flex:none;min-height:44px;padding:0 2px;border:0;background:transparent}
.chip span{display:block;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;background:var(--card2);color:var(--muted)}
.chip.on span{background:var(--fg);color:var(--inv)}
.seg{display:flex;background:var(--card2);border-radius:999px;margin:0 4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.seg button.on{background:var(--fg);color:var(--inv)}

.topic{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--fg);border-radius:20px;padding:16px}
.topic .t1{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:22px}
.topic .meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.topic .flags{display:flex;align-items:center;gap:8px;flex:none}
.pin{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topic .title{margin-top:8px;font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.topic .prev{margin-top:4px;font-size:14px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.topic .foot{margin-top:12px;display:flex;gap:14px;font-size:13px;color:var(--muted)}
.topic .foot .v{font-weight:600}
.topic .foot .v.on{color:var(--fg)}
.topic .foot .au{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{background:var(--card);border-radius:20px;padding:32px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty button{margin-top:14px;min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--fg);color:var(--inv);font-weight:600}

.bar{display:flex;align-items:center;justify-content:space-between}
.back{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 0;border:0;background:transparent;font-size:15px;font-weight:500}
.back svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--card)}
.dots svg{fill:currentColor}
.menu{background:var(--card);border-radius:20px;padding:4px 16px;display:flex;flex-direction:column}
.menu button{min-height:48px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:15px;font-weight:500}
.menu button:first-child{border-top:0}
.thread .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.thread h2{margin:10px 0 4px;font-size:20px;line-height:1.25;font-weight:600;text-wrap:balance;overflow-wrap:anywhere}
.thread .body{margin:14px 0 0;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.votebtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--card2);color:var(--muted);font-size:15px;font-weight:600;margin-top:16px}
.votebtn.on{background:var(--fg);color:var(--inv)}
.cm{padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.cm.reply{margin-left:18px}
.cm .who{display:flex;align-items:center;gap:8px}
.cm .who b{font-weight:600;font-size:14px}
.cm .who i{font-style:normal;padding:1px 8px;border-radius:999px;background:var(--card2);font-size:11px;font-weight:600}
.cm .tx{font-size:15px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.cm .acts{display:flex;align-items:center;font-size:13px}
.cm .acts button{min-height:44px;padding:0 14px 0 0;border:0;background:transparent;font-weight:600;color:var(--muted)}
.cm .acts button.on{color:var(--fg)}
.cm .acts button.rp{font-weight:500;padding:0}
.noc{padding:8px 0 20px;font-size:14px;color:var(--muted)}
.compose{display:flex;flex-direction:column;gap:10px}
.compose .rep{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.compose .rep button{min-height:44px;padding:0 0 0 12px;border:0;background:transparent;font-weight:600;color:var(--fg)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:14px;font:inherit;font-size:15px;line-height:1.4}
textarea{min-height:84px;resize:none;padding:12px 14px}
input[type=text]{min-height:48px;padding:0 14px}
.send{align-self:flex-end;min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--fg);color:var(--inv);font-size:14px;font-weight:600}
.send:disabled,.pub:disabled{opacity:.5}

.me{display:flex;align-items:center;gap:16px}
.ava{flex:none;width:64px;height:64px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-family:'Unbounded',system-ui,sans-serif;font-weight:600;font-size:22px}
.me .nm{font-size:20px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:14px 0}
.stats div{text-align:center;padding:4px 0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:'Unbounded',system-ui,sans-serif;font-weight:500;font-size:22px}
.stats span{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.mine{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:10px 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--fg);text-align:left}
.mine .tt{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.mine .mm{margin-top:2px;font-size:13px;color:var(--muted)}
.mine .rt{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.modrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0;border:0;background:transparent;text-align:left;font-size:15px;font-weight:500}
.sw{flex:none;position:relative;width:46px;height:28px;border-radius:999px;background:var(--card2)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted)}
.sw.on{background:var(--fg)}
.sw.on i{left:21px;background:var(--inv)}

nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(12px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:4px 0;border:0;background:transparent;font-size:11px;font-weight:500;color:var(--muted)}
nav button .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
nav button.on{color:var(--fg);font-weight:600}
nav button.on .pill{background:var(--card2)}
nav svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;padding:0;border:0;background:rgba(0,0,0,.55)}
.sheet{position:relative;background:var(--card);border-radius:24px 24px 0 0;padding:20px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet h3{font-size:18px;font-weight:600}
.sheet .chips{margin:0 -4px}
.sheet textarea{min-height:104px}
.pub{min-height:48px;border:0;border-radius:999px;background:var(--fg);color:var(--inv);font-size:15px;font-weight:600}

.skel{height:92px;border-radius:20px;background:var(--card);opacity:.7}
@media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo"><span>YAB</span><span class="o">STUDIO</span></div></header>
  <div id="content" class="scroll"></div>
  <nav id="nav"></nav>
  <div id="sheet"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const dark = tg.colorScheme !== "light";
document.documentElement.dataset.theme = dark ? "dark" : "light";
try {
  const c = dark ? "#0B0B0C" : "#E9EAEC";
  tg.setHeaderColor(c);
  tg.setBackgroundColor(c);
} catch (e) {}

const CATS = ["Идеи", "Вопросы", "Баги", "Обсуждение"];
const ST = { new: "Новая", planned: "В планах", in_progress: "В работе", done: "Готово" };
const CYCLE = ["new", "planned", "in_progress", "done"];
const STAGES = ["Идея", "Прототип", "Разработка", "Релиз"];

const S = {
  tab: "news", thread: null, cat: "Все", sort: "new",
  sheet: false, menu: false, mod: true, busy: false,
  me: null, home: null, topics: null, comments: {}, error: null,
  draft: {}, replyTo: {}, nt: { cat: "Идеи", title: "", text: "" }, savedScroll: 0,
};
try { S.mod = localStorage.getItem("yab_mod") !== "0"; } catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isMod = () => !!(S.me && S.me.role === "admin" && S.mod);
const haptic = () => { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };

function notify(msg) { try { tg.showAlert(msg); } catch (e) { alert(msg); } }

async function api(path, method = "GET", body) {
  const r = await fetch("/api" + path, {
    method,
    headers: { "X-Init-Data": tg.initData, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    let detail = "";
    try { detail = JSON.stringify((await r.json()).detail || ""); } catch (e) {}
    throw new Error(r.status + " " + detail);
  }
  return r.json();
}

function dayLabel(iso) {
  const d = new Date(iso), n = new Date();
  const sod = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((sod(n) - sod(d)) / 864e5);
  if (diff === 0) return "Сегодня";
  if (diff === 1) return "Вчера";
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}

/* ---------- загрузка данных ---------- */
async function load(fn) {
  try { await fn(); S.error = null; }
  catch (e) { console.error(e); S.error = e.message; }
  render();
}
const loadMe = () => load(async () => { S.me = await api("/me"); });
const loadHome = () => load(async () => { S.home = await api("/home"); });
const loadTopics = () => load(async () => { S.topics = await api("/topics"); });
const loadComments = (ref) => load(async () => { S.comments[ref] = await api("/comments?ref=" + ref); });

/* ---------- разметка ---------- */
const svgChevron = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>';
const svgBack = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>';
const svgPlus = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>';
const svgPin = '<svg class="pin" width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Закреплено"><path d="M9 4h6l-1 6 3 3H7l3-3z"></path><path d="M12 13v7"></path></svg>';
const svgDots = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>';

const dot = (st) => `<span class="dot ${esc(st || "")}"></span>`;
const stat = (st) => (st && ST[st] ? `<span class="st">${dot(st)}${ST[st]}</span>` : "");
const chip = (label, on, click) => `<button type="button" class="chip ${on ? "on" : ""}" onclick="${click}"><span>${esc(label)}</span></button>`;
const skeleton = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';

function errorCard() {
  const hint = /401/.test(S.error || "") ? "Открой приложение из Telegram." : "Не удалось загрузить данные.";
  return `<div class="empty">${hint}<br><button type="button" onclick="boot()">Повторить</button></div>`;
}

function viewNews() {
  const h = S.home;
  if (!h) return S.error ? errorCard() : skeleton;
  let out = "";
  if (h.latest) {
    out += `<div class="card banner"><span class="pt"></span><div class="tx"><b>Последнее</b> · Идея «${esc(h.latest.title)}» от ${esc(h.latest.author)} получила «Оценено»</div></div>`;
  }
  if (h.projects.length) {
    out += `<div class="card tail"><div class="between" style="padding-bottom:12px"><h2 style="font-size:15px;font-weight:600">Проекты</h2><span class="small muted">${h.projects.length}</span></div>` +
      h.projects.map((p) => `
        <div class="proj">
          <div class="top"><span class="name">${esc(p.name)}</span><span class="st small muted">${dot(p.status)}${esc(ST[p.status] || "")}</span></div>
          <div class="segs">${[0, 1, 2, 3].map((i) => `<span class="${i < p.stage ? "on" : ""}"></span>`).join("")}</div>
          <div class="small muted">${p.stage ? STAGES[p.stage - 1] : "Ещё не начато"} · этап ${p.stage} из 4</div>
        </div>`).join("") + "</div>";
  }
  out += h.posts.map((p) => `
    <div class="card tail post">
      <div class="date">${esc(dayLabel(p.created_at))}</div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.text)}</p>
      <button type="button" class="go" onclick="openThread('n${p.id}')"><span>Комментарии · ${p.comments}</span>${svgChevron}</button>
    </div>`).join("");
  if (!h.projects.length && !h.posts.length) out += '<div class="empty">Пока новостей нет.</div>';
  return out;
}

function viewForum() {
  if (!S.topics) return S.error ? errorCard() : skeleton;
  const list = S.topics
    .filter((t) => S.cat === "Все" || t.category === S.cat)
    .sort((a, b) =>
      (Number(b.pinned) - Number(a.pinned)) ||
      (Number(b.rated) - Number(a.rated)) ||
      (S.sort === "top" ? b.votes - a.votes : b.id - a.id));
  return `
    <div class="fhead">
      <div style="display:flex;align-items:baseline"><h2>Форум</h2><span class="n">${S.topics.length}</span></div>
      <button type="button" class="newbtn" onclick="openSheet()">${svgPlus}<span>Тема</span></button>
    </div>
    <div class="filters">
      <div class="chips scroll">${["Все"].concat(CATS).map((c) => chip(c, S.cat === c, `setCat('${c}')`)).join("")}</div>
      <div class="seg">
        <button type="button" class="${S.sort === "new" ? "on" : ""}" onclick="setSort('new')">Новые</button>
        <button type="button" class="${S.sort === "top" ? "on" : ""}" onclick="setSort('top')">Популярные</button>
      </div>
    </div>
    ${list.map((t) => `
      <button type="button" class="topic" onclick="openThread('t${t.id}')">
        <div class="t1">
          <div class="meta"><span>${esc(t.category)}</span>${stat(t.status)}</div>
          <div class="flags">${t.pinned ? svgPin : ""}${t.rated ? '<span class="badge">Оценено</span>' : ""}</div>
        </div>
        <div class="title">${esc(t.title)}</div>
        ${t.text ? `<div class="prev">${esc(t.text)}</div>` : ""}
        <div class="foot"><span class="au">${esc(t.author_id === S.me?.id ? "Ты" : t.author)}</span><span class="v ${t.voted ? "on" : ""}">▲ ${t.votes}</span><span>Ответов: ${t.replies}</span></div>
      </button>`).join("")}
    ${list.length ? "" : '<div class="empty">В этой категории пока пусто. Будь первым.</div>'}`;
}

function commentsBlock(ref, title) {
  const all = S.comments[ref];
  if (!all) return `<div class="card tail"><div class="noc">${S.error ? "Не удалось загрузить." : "Загрузка…"}</div></div>`;
  const roots = all.filter((c) => c.parent_id === null);
  const ordered = [];
  roots.forEach((r) => { ordered.push(r); all.filter((k) => k.parent_id === r.id).forEach((k) => ordered.push(k)); });
  return `<div class="card tail">
    <div class="between" style="padding-bottom:12px"><h3 style="font-size:15px;font-weight:600">${title}</h3><span class="small muted">${all.length}</span></div>
    ${all.length ? "" : '<div class="noc">Пока никто не написал. Начни первым.</div>'}
    ${ordered.map((c) => `
      <div class="cm ${c.parent_id === null ? "" : "reply"}">
        <div class="who"><b>${esc(c.author_id === S.me?.id ? "Ты" : c.author)}</b>${c.staff ? "<i>Автор</i>" : ""}</div>
        <div class="tx">${esc(c.text)}</div>
        <div class="acts">
          <button type="button" class="${c.my === "like" ? "on" : ""}" aria-label="Нравится" onclick="react('${ref}',${c.id},'like')">▲ ${c.likes}</button>
          <button type="button" class="${c.my === "dislike" ? "on" : ""}" aria-label="Не нравится" onclick="react('${ref}',${c.id},'dislike')">▼ ${c.dislikes}</button>
          <button type="button" class="rp" onclick="replyTo('${ref}',${c.id})">Ответить</button>
        </div>
      </div>`).join("")}
  </div>`;
}

function viewThread() {
  const ref = S.thread, isTopic = ref[0] === "t", id = Number(ref.slice(1));
  const item = isTopic ? (S.topics || []).find((t) => t.id === id) : (S.home?.posts || []).find((p) => p.id === id);
  if (!item) return `<div class="bar"><button type="button" class="back" onclick="back()">${svgBack}<span>Назад</span></button></div>` +
    (S.topics || S.home ? '<div class="empty">Эта запись недоступна.</div>' : skeleton);

  const replyId = S.replyTo[ref];
  const target = replyId ? (S.comments[ref] || []).find((c) => c.id === replyId) : null;
  const mod = isTopic && isMod();

  let head = `<div class="bar"><button type="button" class="back" onclick="back()">${svgBack}<span>Назад</span></button>` +
    (mod ? `<button type="button" class="dots" aria-label="Действия модератора" onclick="toggleMenu()">${svgDots}</button>` : "") + "</div>";

  if (mod && S.menu) {
    head += `<div class="menu">
      <button type="button" onclick="modPin(${id})">${item.pinned ? "Открепить" : "Закрепить"}</button>
      <button type="button" onclick="modRate(${id})">${item.rated ? "Убрать «Оценено»" : "Оценить"}</button>
      <button type="button" onclick="modStatus(${id})">Статус: ${item.status ? ST[item.status] : "нет"}</button>
      <button type="button" onclick="modDelete(${id})">Удалить тему</button>
    </div>`;
  }

  const body = isTopic ? `
    <div class="card thread">
      <div class="meta"><span>${esc(item.category)}</span>${stat(item.status)}${item.pinned ? "<span>Закреплено</span>" : ""}${item.rated ? '<span class="badge">Оценено</span>' : ""}</div>
      <h2>${esc(item.title)}</h2>
      <div class="small muted">${esc(item.author_id === S.me?.id ? "Ты" : item.author)}</div>
      ${item.text ? `<p class="body">${esc(item.text)}</p>` : ""}
      <div><button type="button" class="votebtn ${item.voted ? "on" : ""}" onclick="voteTopic(${id})">▲ ${item.votes}</button></div>
    </div>` : `
    <div class="card thread">
      <div class="small muted">${esc(dayLabel(item.created_at))}</div>
      <h2>${esc(item.title)}</h2>
      <p class="body">${esc(item.text)}</p>
    </div>`;

  const compose = `
    <div class="card compose">
      ${target ? `<div class="rep"><span>Ответ для ${esc(target.author_id === S.me?.id ? "себя" : target.author)}</span><button type="button" onclick="cancelReply('${ref}')">Отмена</button></div>` : ""}
      <textarea id="comment-draft" rows="3" maxlength="1000" placeholder="${isTopic ? "Напиши ответ" : "Напиши комментарий"}" oninput="setDraft('${ref}',this.value)">${esc(S.draft[ref] || "")}</textarea>
      <button type="button" class="send" id="sendBtn" onclick="sendComment('${ref}')">Отправить</button>
    </div>`;

  return head + body + commentsBlock(ref, isTopic ? "Ответы" : "Комментарии") + compose;
}

function viewProfile() {
  const m = S.me;
  if (!m) return S.error ? errorCard() : skeleton;
  const mine = (S.topics || []).filter((t) => t.author_id === m.id);
  const rated = mine.filter((t) => t.rated).length || m.rated;
  return `
    <div class="card me">
      <div class="ava">${esc((m.first_name || "?").trim().charAt(0).toUpperCase())}</div>
      <div class="col" style="min-width:0;gap:2px">
        <div class="nm">${esc(m.first_name)}</div>
        ${m.username ? `<div class="muted" style="font-size:14px">@${esc(m.username)}</div>` : ""}
        ${rated ? `<div style="margin-top:6px"><span class="badge">Оценено идей: ${rated}</span></div>` : ""}
      </div>
    </div>
    <div class="card stats">
      <div><b>${m.topics}</b><span>Темы</span></div>
      <div><b>${m.comments}</b><span>Комментарии</span></div>
      <div><b>${m.votes}</b><span>Голоса</span></div>
    </div>
    <div class="card tail">
      <h3 style="margin:0 0 12px;font-size:15px;font-weight:600">Мои темы</h3>
      ${mine.length ? "" : '<div class="noc" style="padding:4px 0 18px">Ты ещё не создавал тем.</div>'}
      ${mine.map((t) => `
        <button type="button" class="mine" onclick="openThread('t${t.id}')">
          <div style="min-width:0"><div class="tt">${esc(t.title)}</div><div class="mm">${esc(t.category)}${t.status ? " · " + ST[t.status] : ""}</div></div>
          <div class="rt">${t.rated ? '<span class="badge">Оценено</span>' : ""}<span>▲ ${t.votes}</span></div>
        </button>`).join("")}
    </div>
    ${m.role === "admin" ? `
    <div class="card" style="padding:6px 16px 14px">
      <button type="button" class="modrow" aria-pressed="${S.mod}" onclick="toggleMod()"><span>Режим модератора</span><span class="sw ${S.mod ? "on" : ""}"><i></i></span></button>
      <div class="small muted">Показывает кнопки управления в темах. Видно только тебе.</div>
    </div>` : ""}`;
}

function renderNav() {
  const item = (tab, label, icon) => `<button type="button" class="${S.tab === tab ? "on" : ""}" onclick="go('${tab}')"><span class="pill">${icon}</span><span>${label}</span></button>`;
  $("nav").innerHTML =
    item("news", "Новости", '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"></rect><path d="M9 9h6M9 13h6M9 16.5h3.5"></path></svg>') +
    item("forum", "Форум", '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-4 3.5V17H6a2 2 0 0 1-2-2z"></path></svg>') +
    item("profile", "Профиль", '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"></path></svg>');
}

function renderSheet() {
  const el = $("sheet");
  if (!S.sheet) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <div class="sheet-wrap">
      <button type="button" class="scrim" aria-label="Закрыть" onclick="closeSheet()"></button>
      <div class="sheet" role="dialog" aria-label="Новая тема">
        <h3>Новая тема</h3>
        <div class="chips scroll">${CATS.map((c) => chip(c, S.nt.cat === c, `setNtCat('${c}')`)).join("")}</div>
        <input id="topic-title" type="text" maxlength="120" placeholder="Название темы" value="${esc(S.nt.title)}" oninput="S.nt.title=this.value">
        <textarea id="topic-text" rows="4" maxlength="1000" placeholder="Расскажи подробнее" oninput="S.nt.text=this.value">${esc(S.nt.text)}</textarea>
        <button type="button" class="pub" id="pubBtn" onclick="publish()">Опубликовать</button>
      </div>
    </div>`;
}

function render() {
  const el = $("content"), top = el.scrollTop;
  const view = S.thread ? viewThread() : S.tab === "news" ? viewNews() : S.tab === "forum" ? viewForum() : viewProfile();
  el.innerHTML = `<div class="page">${view}</div>`;
  el.scrollTop = top;
  renderNav();
  try { S.thread ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}

/* ---------- навигация ---------- */
function go(tab) {
  S.tab = tab; S.thread = null; S.menu = false;
  render(); $("content").scrollTop = 0;
  if (tab === "news") loadHome();
  if (tab === "forum") loadTopics();
  if (tab === "profile") { loadMe(); loadTopics(); }
}
function openThread(ref) {
  S.savedScroll = $("content").scrollTop;
  S.thread = ref; S.menu = false;
  render(); $("content").scrollTop = 0;
  loadComments(ref);
}
function back() {
  S.thread = null; S.menu = false;
  render(); $("content").scrollTop = S.savedScroll;
}
try { tg.BackButton.onClick(() => { if (S.thread) back(); }); } catch (e) {}
function setCat(c) { S.cat = c; render(); }
function setSort(s) { S.sort = s; render(); }
function toggleMenu() { S.menu = !S.menu; render(); }
function toggleMod() {
  S.mod = !S.mod; S.menu = false;
  try { localStorage.setItem("yab_mod", S.mod ? "1" : "0"); } catch (e) {}
  render();
}

/* ---------- комментарии ---------- */
function setDraft(ref, v) { S.draft[ref] = v; }
function replyTo(ref, id) {
  const target = (S.comments[ref] || []).find((c) => c.id === id);
  S.replyTo[ref] = target && target.parent_id !== null ? target.parent_id : id;
  render();
  const ta = $("comment-draft"); if (ta) ta.focus();
}
function cancelReply(ref) { S.replyTo[ref] = null; render(); }

async function sendComment(ref) {
  const text = (S.draft[ref] || "").trim();
  if (text.length < 2) { notify("Напиши хотя бы 2 символа."); return; }
  if (S.busy) return;
  S.busy = true; $("sendBtn").disabled = true;
  try {
    await api("/comments", "POST", { ref, text, parent_id: S.replyTo[ref] || null });
    S.draft[ref] = ""; S.replyTo[ref] = null;
    haptic();
    await Promise.all([loadComments(ref), ref[0] === "t" ? loadTopics() : loadHome()]);
  } catch (e) {
    notify("Не удалось отправить: " + e.message);
  } finally {
    S.busy = false; render();
  }
}

async function react(ref, id, type) {
  const c = (S.comments[ref] || []).find((x) => x.id === id);
  if (!c) return;
  // сначала обновляем экран, потом отправляем на сервер
  if (c.my === type) { type === "like" ? c.likes-- : c.dislikes--; c.my = null; }
  else {
    if (c.my === "like") c.likes--;
    if (c.my === "dislike") c.dislikes--;
    type === "like" ? c.likes++ : c.dislikes++;
    c.my = type;
  }
  haptic(); render();
  try { await api(`/comments/${id}/react`, "POST", { value: type }); }
  catch (e) { notify("Не удалось сохранить: " + e.message); loadComments(ref); }
}

/* ---------- темы ---------- */
async function voteTopic(id) {
  const t = (S.topics || []).find((x) => x.id === id);
  if (!t) return;
  t.voted = !t.voted; t.votes += t.voted ? 1 : -1;
  haptic(); render();
  try { await api(`/topics/${id}/vote`, "POST"); }
  catch (e) { notify("Не удалось проголосовать: " + e.message); loadTopics(); }
}

function openSheet() { S.sheet = true; renderSheet(); }
function closeSheet() { S.sheet = false; renderSheet(); }
function setNtCat(c) { S.nt.cat = c; renderSheet(); }

async function publish() {
  const title = S.nt.title.trim();
  if (title.length < 3) { notify("Название должно быть хотя бы из 3 символов."); return; }
  if (S.busy) return;
  S.busy = true; $("pubBtn").disabled = true;
  try {
    await api("/topics", "POST", { category: S.nt.cat, title, text: S.nt.text.trim() });
    S.nt = { cat: "Идеи", title: "", text: "" };
    S.sheet = false; S.tab = "forum"; S.thread = null; S.cat = "Все"; S.sort = "new";
    haptic();
    renderSheet();
    await loadTopics();
    $("content").scrollTop = 0;
  } catch (e) {
    notify("Не удалось опубликовать: " + e.message);
    $("pubBtn") && ($("pubBtn").disabled = false);
  } finally {
    S.busy = false;
  }
}

/* ---------- модератор ---------- */
async function modPatch(id, body) {
  try { await api(`/topics/${id}`, "PATCH", body); await loadTopics(); }
  catch (e) { notify("Не удалось: " + e.message); }
}
function modPin(id) { const t = S.topics.find((x) => x.id === id); modPatch(id, { pinned: !t.pinned }); }
function modRate(id) { const t = S.topics.find((x) => x.id === id); modPatch(id, { rated: !t.rated }); }
function modStatus(id) {
  const t = S.topics.find((x) => x.id === id);
  const next = t.status ? (CYCLE[CYCLE.indexOf(t.status) + 1] || "none") : "new";
  modPatch(id, { status: next });
}
function modDelete(id) {
  const run = async () => {
    try {
      await api(`/topics/${id}`, "DELETE");
      S.thread = null; S.menu = false;
      await loadTopics();
    } catch (e) { notify("Не удалось удалить: " + e.message); }
  };
  try { tg.showConfirm("Удалить тему?", (ok) => ok && run()); } catch (e) { if (confirm("Удалить тему?")) run(); }
}

/* ---------- старт ---------- */
async function boot() {
  S.error = null; render();
  await Promise.all([loadMe(), loadHome(), loadTopics()]);
}
render();
boot();
</script>
</body>
</html>
