<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui;margin:12px;color:var(--tg-theme-text-color)}h3{margin:0 0 7px;font-size:17px}p{font-size:13px;line-height:1.4;margin:8px 0}button{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border:1px solid var(--tg-theme-section-separator-color);border-radius:9px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);font-size:13px;text-align:left}small{color:var(--tg-theme-hint-color)}.primary{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.grid button{margin:0;min-height:46px}#error{font-size:12px;color:var(--tg-theme-destructive-text-color)}.note{border-top:1px solid var(--tg-theme-section-separator-color);padding-top:9px;color:var(--tg-theme-hint-color);font-size:12px}.refresh{font-size:12px;color:var(--tg-theme-hint-color);padding:7px 10px}</style></head><body><h3 id="title">YAB STUDIO</h3><div id="view"></div><p id="error"></p><script>
var W=TelegramWidget,root=document.getElementById('view'),error=document.getElementById('error'),busy=false;
function text(value,style){var p=document.createElement('p');p.textContent=value;if(style)p.className=style;root.appendChild(p)}
function button(label,action,primary,parent){var b=document.createElement('button');b.textContent=label;if(primary)b.className=primary===true?'primary':primary;b.onclick=action;(parent||root).appendChild(b)}
function ask(action){if(busy)return;busy=true;error.textContent='';W.request(action).then(function(a){busy=false;if(a.result){try{var s=JSON.parse(a.result);if(s.error)error.textContent=s.error;else render(s)}catch(e){error.textContent='Не удалось обновить карточку.'}}},function(){busy=false;error.textContent='Не удалось связаться с ботом. Попробуй обновить.'})}
function render(s){root.textContent='';var kind=s.kind==='checkers'?'Шашки':'Шахматы';document.getElementById('title').textContent=s.screen==='main'?'YAB STUDIO':'Партия с другом';
if(s.screen==='main'){
text('С возвращением, '+s.name+'!');var grid=document.createElement('div');grid.className='grid';root.appendChild(grid);
function open(ref){W.openTelegramLink(s.app_link+'?startapp='+ref)}
button('Открыть студию',function(){open('studio_home')},true,grid);button('Мой профиль',function(){open('studio_profile')},false,grid);
button('Партия с другом',function(){ask('home')},false,grid);button('Друзья',function(){open('studio_friends')},false,grid);
button('Турниры',function(){open('studio_tournaments')},false,grid);button('Почта',function(){open('studio_mail')},false,grid);
if(s.invitations)text('Приглашений в игру: '+s.invitations+'. Карточка с ответом находится в этом чате.','note');
if(s.unread)button('Новых уведомлений: '+s.unread,function(){open('studio_notifications')});
if(s.event){var m=s.event.minutes;text(s.event.title+' · осталось '+(m>=60?Math.floor(m/60)+' ч ':'')+(m%60)+' мин','note')}else if(!s.invitations&&!s.unread)text('Игры, коллекции и друзья — всё под рукой.','note');
}
else if(s.screen==='choose'){text('Выбери игру и пригласи соперника.');button('Шахматы',function(){ask('kind:chess')},true);button('Шашки',function(){ask('kind:checkers')},true);button('‹ Главное меню',function(){ask('studio')})}
else if(s.screen==='players'){text(kind+' · выбери соперника');if(!s.players.length)text('Пока нет доступных игроков. Другу нужно нажать /start у бота и включить уведомления в студии.');s.players.forEach(function(u){button(u.name,function(){ask('invite:'+u.id)})});if(s.page>0)button('← Предыдущие',function(){ask('page:'+(s.page-1))});if(s.page+1<s.pages)button('Следующие →',function(){ask('page:'+(s.page+1))});text('Страница '+(s.page+1)+' / '+s.pages);button('‹ Выбор игры',function(){ask('home')});button('Главное меню',function(){ask('studio')})}
else if(s.screen==='invitation'){text(kind+' · '+s.name);if(s.status==='pending'){text(s.incoming?'Тебя приглашают сыграть. Приглашение действует 30 минут.':s.delivery==='failed'?'Не удалось доставить приглашение. Можно повторить отправку.':'Приглашение отправлено. Ждём ответа.');if(s.incoming){button('Принять',function(){ask('accept')},true);button('Отклонить',function(){ask('decline')})}else{if(s.delivery==='failed')button('Повторить отправку',function(){ask('retry')});button('Отменить приглашение',function(){ask('cancel')})}}
else if(s.status==='accepted'){text('Партия готова! Цвета выбраны случайно.');button('Открыть партию',function(){W.openTelegramLink(s.link)},true);button('Главное меню',function(){ask('studio')})}
else{text(s.status==='expired'?'Время приглашения истекло.':s.status==='declined'?'Приглашение отклонено.':'Приглашение отменено.');button('Создать новую партию',function(){ask('home')});button('Главное меню',function(){ask('studio')})}}
button('Обновить',function(){ask('refresh')},'refresh')}
function sync(){try{render(JSON.parse(W.chatData||'{"screen":"choose"}'))}catch(e){error.textContent='Нажми «Обновить»'}}
W.onEvent('chatDataChanged',sync);sync();W.ready();
</script></body></html>
